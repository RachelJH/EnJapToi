name: Build EnJapToi Windows package

on:
  push:
    branches: [feature/observe-payamount]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test Python bridge
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and test Paper plugin
        run: mvn -B -f paper-plugin/pom.xml clean package
      - name: Assemble Windows installation files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/EnJapToi-Windows/plugins dist/EnJapToi-Windows/bridge dist/EnJapToi-Windows/docs
          cp paper-plugin/target/enjaptoi-0.1.0.jar dist/EnJapToi-Windows/plugins/
          cp bridge/*.py bridge/requirements.txt dist/EnJapToi-Windows/bridge/
          cp bridge/amount-map.example.json dist/EnJapToi-Windows/bridge/
          cp README.md dist/EnJapToi-Windows/설치안내.md
          cp docs/paper-receiver-lifecycle.md dist/EnJapToi-Windows/docs/
          cp docs/donation-effects.md dist/EnJapToi-Windows/docs/
          cd dist
          zip -qr EnJapToi-Windows.zip EnJapToi-Windows
          sha256sum EnJapToi-Windows.zip > EnJapToi-Windows.zip.sha256
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: EnJapToi-Windows
          path: |
            dist/EnJapToi-Windows.zip
            dist/EnJapToi-Windows.zip.sha256
          retention-days: 14
